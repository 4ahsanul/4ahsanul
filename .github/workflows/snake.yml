name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: 4ahsanul
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF0000&color_dots=%23000000,%23330000,%23660000,%23a30000,%23FF0000
            dist/github-contribution-grid-snake.gif?color_snake=%23FF0000&color_dots=%23000000,%23330000,%23660000,%23a30000,%23FF0000

      - name: push snake output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
